<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registrar Envío Web</title>
</head>
<body>
<h1>Pre-registro de Encomienda</h1>

<!-- FORMULARIO -->
<form th:action="@{/cliente/pre-registro/guardar}" th:object="${preRegistro}" method="post">

    <h3>Datos del Remitente</h3>
    DNI: <input type="text" th:field="*{remitenteDni}" required><br>
    Nombres: <input type="text" th:field="*{remitenteNombres}" required><br>
    Apellidos: <input type="text" th:field="*{remitenteApellidos}" required><br>
    Celular: <input type="text" th:field="*{remitenteCelular}" required><br>

    <h3>Datos del Destinatario</h3>
    DNI: <input type="text" th:field="*{destinatarioDni}" required><br>
    Nombres: <input type="text" th:field="*{destinatarioNombres}" required><br>
    Apellidos: <input type="text" th:field="*{destinatarioApellidos}" required><br>
    Celular: <input type="text" th:field="*{destinatarioCelular}" required><br>

    <h3>Datos del Envío</h3>
    <label>Agencia Origen:</label>
    <select th:field="*{agenciaOrigenId}">
        <option th:each="agencia : ${agencias}" th:value="${agencia.id}" th:text="${agencia.nombre}"></option>
    </select><br>

    <label>Agencia Destino:</label>
    <select th:field="*{agenciaDestinoId}">
        <option th:each="agencia : ${agencias}" th:value="${agencia.id}" th:text="${agencia.nombre}"></option>
    </select><br>

    <label>Tipo de Paquete:</label>
    <select th:field="*{tipoPaqueteId}">
        <option th:each="tipo : ${tiposPaquete}" th:value="${tipo.id}" th:text="${tipo.nombre}"></option>
    </select><br>

    Descripción: <input type="text" th:field="*{descripcionBulto}"><br>
    Peso aprox (kg): <input type="number" step="0.1" th:field="*{pesoEstimado}"><br>

    <button type="submit">Generar Pre-registro</button>
</form>

<!-- Mensaje de éxito o error (Opcional) -->
<div th:if="${mensajeExito}" style="color: green;" th:text="${mensajeExito}"></div>
<div th:if="${mensajeError}" style="color: red;" th:text="${mensajeError}"></div>

</body>
</html>
